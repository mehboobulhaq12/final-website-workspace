<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="/client/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Effect3 · Client Portal — Sign in</title>
  <link rel="icon" href="assets/effect3-logo.png" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap");

    :root {
      --brand-50: #fff4ee;
      --brand-100: #ffe3d3;
      --brand-300: #fbaf90;
      --brand-400: #fb8560;
      --brand-500: #f96443;
      --brand-600: #f04a28;
      --brand-700: #d13a1c;
      --ink-0: #ffffff;
      --ink-50: #f5f5f2;
      --ink-75: #eeeee9;
      --ink-100: #e6e6e0;
      --ink-400: #8c8c82;
      --ink-600: #4a4a44;
      --ink-900: #0b0b0a;
      --stroke: rgba(11, 11, 10, 0.08);
      --stroke-strong: rgba(11, 11, 10, 0.14);
      --brand-gradient: linear-gradient(135deg, #fbaf90 0%, #f96443 55%, #f63b2c 100%);
      --shadow-lg: 0 8px 16px rgba(11, 11, 10, 0.06), 0 24px 48px rgba(11, 11, 10, 0.08);
      --shadow-brand: 0 6px 18px rgba(249, 100, 67, 0.28);
      --shadow-focus: 0 0 0 4px rgba(249, 100, 67, 0.18);
      --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink-900);
      background:
        radial-gradient(900px 600px at 8% -5%, var(--brand-50), transparent 60%),
        var(--ink-75);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }

    .login-root {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .shell {
      width: min(100%, 1140px);
      min-height: min(720px, calc(100vh - 80px));
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      overflow: hidden;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: var(--ink-50);
      box-shadow: var(--shadow-lg);
      animation: shell-in 720ms var(--ease-out) both;
    }

    .brand-panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: var(--ink-900);
    }

    #streaks {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(11, 11, 10, 0.62), transparent 42%),
        radial-gradient(520px 440px at 14% 100%, rgba(249, 100, 67, 0.2), transparent 70%);
    }

    .brand-panel-content {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
      padding: 48px 52px;
    }

    .bp-top {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: rise 700ms var(--ease-out) 120ms both;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--brand-500);
      box-shadow: 0 0 14px 2px rgba(249, 100, 67, 0.8);
    }

    .tag {
      color: rgba(255, 255, 255, 0.62);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .bp-head {
      max-width: 11ch;
      margin: 0;
      color: #fff;
      font-size: clamp(38px, 4.4vw, 60px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.98;
      text-wrap: balance;
      animation: rise 800ms var(--ease-out) 200ms both;
    }

    .accent {
      color: transparent;
      background: linear-gradient(120deg, #fbaf90 0%, #f96443 60%, #f04a28 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bp-foot {
      animation: rise 800ms var(--ease-out) 320ms both;
    }

    .bp-foot p {
      max-width: 34ch;
      margin: 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      line-height: 1.5;
    }

    .bp-foot b {
      color: rgba(255, 255, 255, 0.88);
      font-weight: 700;
    }

    .form-panel {
      display: grid;
      align-items: center;
      justify-items: center;
      padding: 40px;
      overflow-y: auto;
    }

    .form-inner {
      width: 100%;
      max-width: 360px;
    }

    .form-inner > * {
      animation: rise 600ms var(--ease-out) both;
    }

    .form-logo {
      display: block;
      width: auto;
      height: 30px;
      margin: 0 0 30px;
      animation-delay: 160ms;
    }

    .form-title {
      margin: 0 0 10px;
      color: var(--ink-900);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.05;
      animation-delay: 210ms;
    }

    .form-sub {
      margin: 0 0 28px;
      color: var(--ink-600);
      font-size: 14.5px;
      line-height: 1.5;
      animation-delay: 250ms;
    }

    form { animation-delay: 300ms; }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink-900);
      font-size: 13.5px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      color: var(--ink-900);
      border: 1px solid var(--stroke-strong);
      border-radius: 14px;
      background: #fff;
      font-size: 14.5px;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .field input::placeholder {
      color: var(--ink-400);
    }

    .field input:focus {
      outline: none;
      border-color: var(--brand-500);
      box-shadow: var(--shadow-focus);
    }

    .cta {
      width: 100%;
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 8px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--brand-gradient);
      box-shadow: var(--shadow-brand);
      cursor: pointer;
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      transition: transform 120ms ease, box-shadow 220ms ease, filter 120ms ease;
    }

    .cta:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: saturate(1.05);
      box-shadow: 0 10px 26px rgba(249, 100, 67, 0.34);
    }

    .cta:active:not(:disabled) {
      transform: translateY(0);
    }

    .cta:disabled {
      cursor: default;
      filter: grayscale(0.2) saturate(0.7);
      opacity: 0.58;
      box-shadow: none;
    }

    .form-foot {
      margin: 22px 0 0;
      color: var(--ink-600);
      text-align: center;
      font-size: 14px;
      animation-delay: 380ms;
    }

    .form-foot a {
      color: var(--ink-900);
      font-weight: 800;
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .form-state {
      margin: 12px 0 0;
      min-height: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #d23b1e;
    }

    .portal-state {
      min-height: 20px;
      margin-top: 16px;
      color: var(--brand-700);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .form-title.sm {
      font-size: 28px;
    }

    .form-sub.center {
      text-align: center;
    }

    .form-inner.wide {
      max-width: 400px;
    }

    .load-wrap,
    .ready-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise 600ms var(--ease-out) both;
    }

    .load-ring {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 26px;
    }

    .load-ring::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 5px solid rgba(249, 100, 67, 0.12);
      border-radius: 50%;
    }

    .ring-arc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 8%, var(--brand-300) 32%, var(--brand-500) 62%, var(--brand-600) 80%, transparent 92% 100%);
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
      animation: spin 1.1s linear infinite;
    }

    .ring-core {
      position: absolute;
      inset: 30px;
      border-radius: 50%;
      background: var(--brand-gradient);
      box-shadow: var(--shadow-brand);
      animation: core-pulse 1.6s ease-in-out infinite;
    }

    .load-title {
      margin-bottom: 6px;
      color: var(--ink-900);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .load-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      color: var(--ink-600);
      font-size: 13.5px;
      flex-wrap: wrap;
    }

    .load-sub b {
      color: var(--ink-900);
      font-weight: 800;
    }

    .src {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding-left: 10px;
      border-left: 1px solid var(--stroke-strong);
      color: var(--ink-400);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .src-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0e8f66;
    }

    .load-bar {
      width: 100%;
      height: 5px;
      margin-bottom: 24px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--ink-100);
    }

    .load-fill {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: var(--brand-gradient);
      transform-origin: left;
      animation: fill-up 2200ms cubic-bezier(0.4, 0, 0.1, 1) forwards;
    }

    .load-steps,
    .ws-list {
      width: 100%;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .load-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .lstep {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink-400);
      font-size: 13.5px;
      transition: color 220ms ease;
    }

    .lstep.active {
      color: var(--ink-900);
      font-weight: 700;
    }

    .lstep.done {
      color: var(--ink-600);
    }

    .ls-ic {
      width: 20px;
      height: 20px;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      border-radius: 50%;
      color: var(--ink-400);
      background: var(--ink-75);
    }

    .lstep.active .ls-ic {
      color: var(--brand-500);
      background: var(--brand-50);
    }

    .lstep.done .ls-ic {
      color: #0e8f66;
      background: #e4f5ee;
    }

    .ls-spin {
      width: 9px;
      height: 9px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    .ws-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
      padding: 5px 11px;
      border: 1px solid var(--stroke-strong);
      border-radius: 999px;
      background: var(--ink-0);
      color: var(--ink-600);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .ws-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #0e8f66;
      box-shadow: 0 0 0 3px rgba(14, 143, 102, 0.15);
    }

    .ws-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .ws-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 14px;
      border: 1.5px solid var(--stroke);
      border-radius: 14px;
      background: var(--ink-0);
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }

    .ws-card:hover,
    .ws-card.selected {
      border-color: var(--brand-500);
      box-shadow: var(--shadow-focus);
      transform: translateY(-1px);
    }

    .ws-ava {
      width: 42px;
      height: 42px;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .ws-meta {
      min-width: 0;
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 2px;
    }

    .ws-name {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      color: var(--ink-900);
      font-size: 14.5px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ws-tag {
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--brand-700);
      background: var(--brand-50);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .ws-line {
      color: var(--ink-600);
      font-size: 12.5px;
    }

    .ws-stats {
      color: var(--ink-400);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .ws-check {
      width: 22px;
      height: 22px;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      border: 1.5px solid var(--stroke-strong);
      border-radius: 50%;
      color: #fff;
    }

    .ws-card.selected .ws-check {
      border-color: var(--brand-500);
      background: var(--brand-500);
    }

    .ready-check {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 50%;
      color: #0e8f66;
      background: #e4f5ee;
      animation: pop 480ms var(--ease-out) both;
    }

    .cta.ghost {
      border: 1px solid var(--stroke-strong);
      color: var(--ink-900);
      background: var(--ink-0);
      box-shadow: none;
    }

    .cta.ghost:hover {
      background: var(--ink-50);
      box-shadow: 0 1px 2px rgba(11, 11, 10, 0.04), 0 2px 6px rgba(11, 11, 10, 0.04);
      filter: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes shell-in {
      from { transform: translateY(16px) scale(0.99); }
      to { transform: none; }
    }

    @keyframes rise {
      from { transform: translateY(16px); }
      to { transform: none; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes core-pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.7; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes fill-up {
      from { transform: scaleX(0.02); }
      to { transform: scaleX(1); }
    }

    @keyframes pop {
      from { transform: scale(0.6); }
      to { transform: scale(1); }
    }

    @media (max-width: 860px) {
      .login-root {
        padding: 24px 16px;
        place-items: start center;
      }

      .shell {
        grid-template-columns: 1fr;
        min-height: 0;
        max-width: 460px;
      }

      .brand-panel {
        min-height: 260px;
      }

      .brand-panel-content {
        padding: 32px;
      }

      .form-panel {
        padding: 36px 28px;
      }
    }

    @media (max-width: 520px) {
      .login-root { padding: 14px 12px; place-items: start stretch; }
      .shell { max-width: 100%; border-radius: 18px; }
      .brand-panel { min-height: 132px; }
      .brand-panel-content { padding: 20px; }
      .form-panel { padding: 24px 18px; }
      .form-title { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="login-root">
    <section class="shell" aria-label="Effect3 Client Portal login">
      <aside class="brand-panel">
        <canvas id="streaks" aria-hidden="true"></canvas>
        <div class="brand-panel-content">
          <div class="bp-top">
            <span class="dot" aria-hidden="true"></span>
            <span class="tag">Effect3 · Client Portal</span>
          </div>

          <h1 class="bp-head">Your AI Deployment <span class="accent">Partner</span></h1>

          <div class="bp-foot">
            <p>One workspace to track your project, deliverables and what the <b>Effect3</b> team is building right now.</p>
          </div>
        </div>
      </aside>

      <section class="form-panel" id="flow-panel">
        <div class="form-inner">
          <img class="form-logo" src="assets/effect3-logo.png" alt="Effect3" />
          <h2 class="form-title">Get Started</h2>
          <p class="form-sub">Welcome to Effect3. Find the private portal connected to your company workspace.</p>

          <form id="portal-form" autocomplete="off">
            <div class="field">
              <label for="company">Find your Company Name</label>
              <input id="company" name="company" type="text" placeholder="e.g. Acme Inc." required />
            </div>

            <div class="field">
              <label for="decision-maker">Company Decision Maker Name</label>
              <input id="decision-maker" name="decision-maker" type="text" placeholder="e.g. Jane Cooper" />
            </div>

            <button class="cta" id="portal-button" type="submit" disabled>Find your Portal</button>
            <div class="portal-state" id="portal-state" role="status" aria-live="polite"></div>
          </form>

          <p class="form-foot">Already have account? <a href="#">Login</a></p>
        </div>
      </section>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("streaks");
    const ctx = canvas.getContext("2d");
    const coral = [249, 100, 67];
    const peach = [251, 175, 144];
    const deep = [240, 74, 40];
    let width = 0;
    let height = 0;
    let dpr = 1;
    let tick = 0;
    let streaks = [];

    function rgba(color, alpha) {
      return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
    }

    function buildStreaks() {
      streaks = [];
      const count = 11;
      for (let i = 0; i < count; i += 1) {
        const f = i / (count - 1);
        const leftBias = Math.pow(1 - f, 1.6);
        streaks.push({
          x: 0.04 + f * 0.92 + (Math.random() - 0.5) * 0.03,
          width: 0.05 + Math.random() * 0.09,
          color: f < 0.42 ? coral : (f < 0.62 ? peach : [225, 222, 215]),
          base: (0.1 + leftBias * 0.62) * (f < 0.62 ? 1 : 0.5),
          phase: Math.random() * Math.PI * 2,
          speed: 0.006 + Math.random() * 0.01,
          travel: 0.4 + Math.random() * 0.5,
          rise: 0.55 + leftBias * 0.4
        });
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildStreaks();
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#0b0b0a";
      ctx.fillRect(0, 0, width, height);

      const breathe = 0.82 + 0.18 * Math.sin(tick * 0.012);
      const glow = ctx.createRadialGradient(width * 0.16, height * 1.02, 0, width * 0.16, height * 1.02, Math.max(width, height) * (0.62 * breathe));
      glow.addColorStop(0, rgba(deep, 0.55 * breathe));
      glow.addColorStop(0.35, rgba(coral, 0.28));
      glow.addColorStop(1, rgba(coral, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.filter = "blur(14px)";
      ctx.globalCompositeOperation = "screen";
      for (const streak of streaks) {
        const centerX = streak.x * width;
        const bandWidth = streak.width * width;
        const highlight = (tick * streak.travel * 0.0016 + streak.phase) % 1;
        const topY = height * (1 - streak.rise);
        const gradient = ctx.createLinearGradient(0, height, 0, topY);
        const amp = 0.7 + 0.3 * Math.sin(tick * streak.speed + streak.phase);
        const alpha = streak.base * amp;
        gradient.addColorStop(0, rgba(streak.color, alpha));
        gradient.addColorStop(Math.max(0.001, highlight - 0.12), rgba(streak.color, alpha * 0.35));
        gradient.addColorStop(highlight, rgba(streak.color, Math.min(0.9, alpha * 1.7)));
        gradient.addColorStop(Math.min(0.95, highlight + 0.06), rgba(streak.color, alpha * 0.3));
        gradient.addColorStop(1, rgba(streak.color, 0));
        ctx.fillStyle = gradient;
        ctx.fillRect(centerX - bandWidth / 2, topY, bandWidth, height - topY);
      }
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.5;
      for (let x = 26; x < width; x += 26) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.018)";
        ctx.fillRect(x, 0, 1, height);
      }
      ctx.restore();

      tick += 1;
      requestAnimationFrame(render);
    }

    const flowPanel = document.getElementById("flow-panel");
    const initialLoginMarkup = flowPanel.innerHTML;
    const session = { company: "", decisionMaker: "", workspace: null, clientKey: "" };
    const timers = [];

    const clientAliases = {
      "in the visuals": "itv",
      "inthevisuals": "itv",
      "itv": "itv",
      "print us pro": "pup",
      "printuspro": "pup",
      "pup": "pup",
      "pup - print us pro": "pup",
    };

    function clientKeyFor(name) {
      return clientAliases[String(name || "").trim().toLowerCase()] || "";
    }

    function clearTimers() {
      while (timers.length) window.clearTimeout(timers.pop());
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "W";
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function checkIcon(size = 14) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
    }

    function arrowIcon(size = 15) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(90deg)" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>`;
    }

    function workspacesFor(companyName) {
      const c = companyName || "Workspace";
      return [
        { id: "prod", name: c, sub: "Production workspace", role: "Owner", members: 12, synced: "2m ago", colors: ["#fb8560", "#f04a28"], primary: true },
        { id: "ops", name: `${c} · Ops`, sub: "Delivery & operations", role: "Member", members: 7, synced: "14m ago", colors: ["#1a1a17", "#4a4a44"] },
        { id: "gtm", name: `${c} · Growth`, sub: "GTM & marketing pod", role: "Member", members: 5, synced: "1h ago", colors: ["#2563d9", "#5b8def"] }
      ];
    }

    function renderLogin() {
      clearTimers();
      flowPanel.innerHTML = initialLoginMarkup;
      bindLogin();
    }

    function bindLogin() {
      const form = document.getElementById("portal-form");
      const companyInput = document.getElementById("company");
      const decisionMakerInput = document.getElementById("decision-maker");
      const button = document.getElementById("portal-button");
      const state = document.getElementById("portal-state");

      companyInput.addEventListener("input", () => {
        button.disabled = !companyInput.value.trim();
        state.textContent = "";
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const companyName = companyInput.value.trim();
        if (!companyName) return;
        session.company = companyName;
        session.clientKey = clientKeyFor(companyName);
        session.decisionMaker = decisionMakerInput.value.trim();
        if (!session.clientKey) {
          state.textContent = "We couldn't find a workspace for that company name.";
          return;
        }
        renderLoading({
          company: companyName,
          title: "Connecting to your workspace",
          steps: ["Verifying company details", "Connecting to Notion", "Locating your workspace", "Preparing sign in"],
          duration: 1600,
          onDone: () => renderCredentials()
        });
      });
    }

    function renderCredentials() {
      clearTimers();
      flowPanel.innerHTML = `
        <div class="form-inner">
          <div class="ws-badge"><span class="ws-badge-dot"></span> Secure sign in</div>
          <h2 class="form-title sm">Sign in to your portal</h2>
          <p class="form-sub">Enter your email and password. We'll take you to your workspace.</p>
          <form id="auth-form" autocomplete="on">
            <div class="field"><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required /></div>
            <div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required /></div>
            <button class="cta" id="auth-submit" type="submit">Sign in ${arrowIcon()}</button>
            <p class="form-state" id="auth-state"></p>
          </form>
          <p class="form-foot">New here? <a href="#" id="go-signup">Create an account</a></p>
        </div>
      `;
      const authForm = document.getElementById("auth-form");
      const authState = document.getElementById("auth-state");
      const submit = document.getElementById("auth-submit");
      document.getElementById("go-signup").addEventListener("click", (e) => { e.preventDefault(); renderSignup(); });
      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("auth-email").value.trim();
        const password = document.getElementById("auth-password").value;
        if (!email || !password) { authState.textContent = "Enter your email and password."; return; }
        submit.disabled = true;
        authState.textContent = "Signing in...";
        let res;
        try {
          res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
        } catch {
          submit.disabled = false; authState.textContent = "Network error. Try again."; return;
        }
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.token) {
          submit.disabled = false;
          authState.textContent = body.error || "Sign in failed.";
          return;
        }
        try { localStorage.setItem(`e3_session_${body.client}`, body.token); } catch {}
        const target = `/client?client=${encodeURIComponent(body.client)}&company=${encodeURIComponent(body.company || "")}`;
        renderLoading({
          company: body.company || "your workspace",
          title: "Opening your workspace",
          steps: ["Verifying credentials", "Connecting to Notion", "Syncing your workspace", "Preparing your portal"],
          duration: 2200,
          onDone: () => { window.location.href = target; },
        });
      });
    }

    function renderSignup() {
      clearTimers();
      flowPanel.innerHTML = `
        <div class="form-inner">
          <div class="ws-badge"><span class="ws-badge-dot"></span> New account</div>
          <h2 class="form-title sm">Create your portal account</h2>
          <p class="form-sub">Sign up with your work email, then tell us your company to find your portal.</p>
          <form id="signup-form" autocomplete="on">
            <div class="field"><label for="su-email">Work email</label><input id="su-email" type="email" autocomplete="email" placeholder="you@company.com" required /></div>
            <div class="field"><label for="su-password">Password</label><input id="su-password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required /></div>
            <div class="field"><label for="su-company">Company name (find your portal)</label><input id="su-company" type="text" placeholder="Your company name" required /></div>
            <button class="cta" id="su-submit" type="submit">Create account &amp; enter ${arrowIcon()}</button>
            <p class="form-state" id="su-state"></p>
          </form>
          <p class="form-foot">Already have an account? <a href="#" id="go-signin">Sign in</a></p>
        </div>
      `;
      document.getElementById("go-signin").addEventListener("click", (e) => { e.preventDefault(); renderCredentials(); });
      const f = document.getElementById("signup-form");
      const st = document.getElementById("su-state");
      const sb = document.getElementById("su-submit");
      f.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("su-email").value.trim();
        const password = document.getElementById("su-password").value;
        const company = document.getElementById("su-company").value.trim();
        if (!email || !password || !company) { st.textContent = "Fill in all fields."; return; }
        sb.disabled = true; st.textContent = "Creating your account...";
        let res;
        try {
          res = await fetch("/api/auth/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password, company }) });
        } catch { sb.disabled = false; st.textContent = "Network error. Try again."; return; }
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.token) { sb.disabled = false; st.textContent = body.error || "Sign up failed."; return; }
        try { localStorage.setItem(`e3_session_${body.client}`, body.token); } catch {}
        const target = `/client?client=${encodeURIComponent(body.client)}&company=${encodeURIComponent(body.company || company)}`;
        renderLoading({
          company: body.company || company,
          title: "Setting up your workspace",
          steps: ["Creating your account", "Connecting to Notion", "Preparing your portal"],
          duration: 2200,
          onDone: () => { window.location.href = target; },
        });
      });
    }

    function renderLoading({ company: companyName, title, steps, duration, onDone }) {
      clearTimers();
      flowPanel.innerHTML = `
        <div class="load-wrap">
          <div class="load-ring">
            <span class="ring-arc"></span>
            <span class="ring-core"></span>
          </div>
          <div class="load-title">${escapeHtml(title)}</div>
          <div class="load-sub">
            <span>for <b>${escapeHtml(companyName)}</b></span>
            <span class="src"><span class="src-dot"></span> via Notion</span>
          </div>
          <div class="load-bar"><span class="load-fill" style="animation-duration: ${duration}ms"></span></div>
          <ul class="load-steps">
            ${steps.map((step, index) => `
              <li class="lstep ${index === 0 ? "active" : ""}" data-step="${index}">
                <span class="ls-ic"><span class="ls-spin"></span></span>
                <span>${escapeHtml(step)}</span>
              </li>
            `).join("")}
          </ul>
        </div>
      `;

      const perStep = duration / steps.length;
      steps.forEach((_, index) => {
        timers.push(window.setTimeout(() => {
          document.querySelectorAll(".lstep").forEach((item, itemIndex) => {
            item.classList.toggle("done", itemIndex < index + 1);
            item.classList.toggle("active", itemIndex === index + 1);
            if (itemIndex < index + 1) {
              item.querySelector(".ls-ic").innerHTML = checkIcon(13);
            }
          });
        }, Math.max(250, perStep * (index + 1) - perStep * 0.25)));
      });

      timers.push(window.setTimeout(onDone, duration));
    }

    function renderWorkspaceSelect() {
      clearTimers();
      const workspaces = workspacesFor(session.company);
      session.workspace = workspaces[0];
      flowPanel.innerHTML = `
        <div class="form-inner wide">
          <div class="ws-badge"><span class="ws-badge-dot"></span> Connected to Notion</div>
          <h2 class="form-title sm">Select your workspace</h2>
          <p class="form-sub">We found ${workspaces.length} workspaces for <b>${escapeHtml(session.company)}</b>. Choose one to open.</p>
          <ul class="ws-list">
            ${workspaces.map((workspace, index) => `
              <li>
                <button type="button" class="ws-card ${index === 0 ? "selected" : ""}" data-workspace="${workspace.id}">
                  <span class="ws-ava" style="background: linear-gradient(135deg, ${workspace.colors[0]}, ${workspace.colors[1]})">${escapeHtml(initials(workspace.name))}</span>
                  <span class="ws-meta">
                    <span class="ws-name">${escapeHtml(workspace.name)}${workspace.primary ? '<span class="ws-tag">Primary</span>' : ""}</span>
                    <span class="ws-line">${escapeHtml(workspace.sub)}</span>
                    <span class="ws-stats">${escapeHtml(workspace.role)} · ${workspace.members} members · synced ${escapeHtml(workspace.synced)}</span>
                  </span>
                  <span class="ws-check">${index === 0 ? checkIcon(14) : ""}</span>
                </button>
              </li>
            `).join("")}
          </ul>
          <button type="button" class="cta" id="open-workspace">Open workspace ${arrowIcon()}</button>
          <p class="form-foot">Wrong company? <a href="#" id="start-over">Start over</a></p>
        </div>
      `;

      document.querySelectorAll(".ws-card").forEach((card) => {
        card.addEventListener("click", () => {
          document.querySelectorAll(".ws-card").forEach((item) => {
            item.classList.remove("selected");
            item.querySelector(".ws-check").innerHTML = "";
          });
          card.classList.add("selected");
          card.querySelector(".ws-check").innerHTML = checkIcon(14);
          session.workspace = workspaces.find((workspace) => workspace.id === card.dataset.workspace);
        });
        card.addEventListener("dblclick", openSelectedWorkspace);
      });

      document.getElementById("open-workspace").addEventListener("click", openSelectedWorkspace);
      document.getElementById("start-over").addEventListener("click", (event) => {
        event.preventDefault();
        renderLogin();
      });
    }

    function openSelectedWorkspace() {
      const workspaceName = session.workspace ? session.workspace.name : session.company;
      renderLoading({
        company: workspaceName,
        title: "Opening your workspace",
        steps: ["Loading workspace", "Fetching project data", "Rendering your portal"],
        duration: 1800,
        onDone: renderReady
      });
    }

    function renderReady() {
      clearTimers();
      const workspaceName = session.workspace ? session.workspace.name : session.company;
      const portalHref = session.clientKey
        ? `/client?client=${encodeURIComponent(session.clientKey)}&company=${encodeURIComponent(session.company)}`
        : `/client?company=${encodeURIComponent(session.company)}`;
      flowPanel.innerHTML = `
        <div class="ready-wrap">
          <div class="ready-check">${checkIcon(30)}</div>
          <h2 class="form-title sm">You're in</h2>
          <p class="form-sub center"><b>${escapeHtml(workspaceName)}</b> is ready. Open your portal to track progress, tasks and your Effect3 team.</p>
          <a class="cta" href="${portalHref}" style="max-width: 220px; text-decoration: none;">Enter portal ${arrowIcon()}</a>
          <button type="button" class="cta ghost" id="back-to-start" style="margin-top: 10px;">Back to start</button>
        </div>
      `;
      document.getElementById("back-to-start").addEventListener("click", renderLogin);
    }

    window.addEventListener("resize", resize);
    // Universal sign in: one email/password screen for every client.
    renderCredentials();
    resize();
    render();
  </script>
</body>
</html>
